name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
        with:
          gradle-version: '8.13'
      - name: Verify documented version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          gradle = Path("app/build.gradle.kts").read_text()
          readme = Path("README.md").read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          code = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          documented = re.search(r'Version:\s*`([^`]+)`\s*\(versionCode\s*`(\d+)`\)', readme)
          if not (version and code and documented):
              raise SystemExit("Could not determine Gradle or README version metadata")
          expected = (version.group(1), code.group(1))
          actual = (documented.group(1), documented.group(2))
          if actual != expected:
              raise SystemExit(f"README version {actual} does not match Gradle version {expected}")
          print(f"Version metadata verified: {expected[0]} ({expected[1]})")
          PY
      - name: Run Android lint
        run: gradle --no-daemon --stacktrace :app:lint
      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Generate APK checksum
        working-directory: app/build/outputs/apk/release
        run: |
          apk="$(find . -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          sha256sum "$(basename "$apk")" > SHA256SUMS.txt
      - name: Verify APK checksum
        working-directory: app/build/outputs/apk/release
        run: sha256sum -c SHA256SUMS.txt
      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universal-scanner-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
